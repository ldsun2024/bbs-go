<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码</title>
<link rel="stylesheet" href="../../assets/tokens.css">
<link rel="stylesheet" href="../../assets/ui.css">
</head>
<body>

<header class="a-topbar">
  <div class="a-wrap a-topbar-in">
    <a class="a-logo" href="../content/home.html"><span class="a-logo-mark"></span>BBS</a>
    <nav class="a-nav">
      <a href="../content/topics.html">话题</a>
      <a href="../content/articles.html">文章</a>
      <a href="../content/search.html">问答</a>
    </nav>
    <div class="a-topbar-r">
      <a class="a-btn sm ghost" href="signin.html">登录</a>
    </div>
  </div>
</header>

<main class="a-wrap a-main">
  <div class="a-form-page">

    <nav class="a-breadcrumb a-breadcrumb-top">
      <a href="../content/home.html">首页</a><span class="sep">/</span>
      <a href="signin.html">登录</a><span class="sep">/</span>
      <span class="cur">重置密码</span>
    </nav>

    <div class="a-kicker">Reset 02 / 02</div>
    <h1 class="a-page-title sm a-mt-3">设置新密码</h1>
    <p class="a-page-sub">
      链接已验证，账号为 lin****@example.com。设置新密码后，其他设备上的登录会被强制退出。
    </p>

    <div class="a-mt-6">
      <label class="a-form-label" for="p1">新密码</label>
      <input class="a-input" id="p1" type="password" value="correct-horse">
      <div class="a-progress a-mt-3"><i class="w8"></i></div>
      <div class="a-setting-desc">强度：中 · 建议 12 位以上，混合字母、数字与符号。</div>
    </div>

    <div class="a-mt-5">
      <label class="a-form-label" for="p2">确认新密码</label>
      <input class="a-input" id="p2" type="password" placeholder="再输入一次">
    </div>

    <div class="a-mt-4">
      <label class="a-check"><input type="checkbox" checked> 同时退出其他设备上的登录</label>
    </div>

    <button class="a-btn block a-mt-5" type="button">保存新密码并登录</button>

    <div class="a-hr-text">或</div>

    <p class="a-note">
      不想改密码？<a class="a-link-u" href="signin.html">返回登录</a>。
      如果这不是你发起的操作，请立即
      <a class="a-link-u" href="password-forgot.html">重新申请</a> 并联系管理员。
    </p>

    <!-- 错误状态 -->
    <div class="a-section-lg">
      <div class="a-empty">
        <div class="a-empty-mark">!</div>
        <div>
          <h3>链接已失效</h3>
          <p>重置链接超过 30 分钟或已被使用过。为了安全，需要重新申请一次。</p>
        </div>
        <a class="a-btn sm accent" href="password-forgot.html">重新申请</a>
      </div>
    </div>

    <!-- 规则 -->
    <div class="a-section">
      <div class="a-box-h">密码要求</div>
      <ul>
        <li class="a-kv"><span>长度</span><b>8–64 位</b></li>
        <li class="a-kv"><span>字符</span><b>至少含字母与数字</b></li>
        <li class="a-kv"><span>禁止</span><b>与昵称、邮箱相同</b></li>
        <li class="a-kv"><span>建议</span><b>使用密码管理器生成</b></li>
      </ul>
    </div>

  </div>
</main>

</body>
</html>
